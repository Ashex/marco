[package]
name = "marco-harness"
version.workspace = true
edition = "2021"
description = "marco's harness: record a Jetstream or firehose capture, replay it as a fake source, the kill -9 test against a capture, the live tail-lag and throughput measurements, and the Graph read load generator (perf)"
license = "MIT"
publish = false

[[bin]]
name = "marco-harness"
path = "src/main.rs"

[features]
default = ["jemalloc"]
# jemalloc as the allocator, as the server has it, so in-process perf runs allocate the same way
jemalloc = ["marco-ops/jemalloc"]

[dependencies]
marco-core = { workspace = true }
marco-ops = { workspace = true }
marco-ingest = { workspace = true }
marco-proto = { workspace = true, features = ["client"] }
marco-server = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
buffa = { workspace = true }
bytes = "1"
clap = { workspace = true }
connectrpc = { workspace = true, features = ["client"] }
futures = { workspace = true }
http = { workspace = true }
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = { workspace = true }
prometheus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "process", "fs", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["__rustls-tls", "rustls-tls-webpki-roots"] }
tracing = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
