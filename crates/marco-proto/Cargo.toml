[package]
name = "marco-proto"
version.workspace = true
edition = "2021"
description = "marco's API: marco.v1.Graph and marco.v1.Admin messages (buffa) and services (connect-rust), generated by `just gen`"
license = "MIT"
publish = false

[features]
# The generated clients (tests, and anyone calling marco from Rust)
client = ["connectrpc/client"]

[dependencies]
buffa = { workspace = true, features = ["json"] }
connectrpc = { workspace = true, features = ["json", "gzip", "zstd"] }
serde = { workspace = true }
serde_json = { workspace = true }
