[package]
name = "marco-load"
version.workspace = true
edition = "2021"
description = "marco's bulk loader (snapshot from exported (repo, rkey, subject) rows) and the P0 measurements: open, reads, verify, delete replay"
license = "MIT"
publish = false

[features]
default = ["jemalloc", "metrics", "scylla"]
# scan-scylla and fill-scylla (the scylla driver and tokio)
scylla = ["dep:scylla", "dep:tokio", "dep:uuid", "dep:futures"]
jemalloc = ["marco-ops/jemalloc"]
# off: marco-core without its op metrics, for the overhead bench
metrics = ["marco-core/metrics"]

[dependencies]
marco-core = { workspace = true }
marco-ops = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
zstd = { workspace = true }
clap = { workspace = true }
prometheus = { workspace = true }
toml = { workspace = true }
libc = { workspace = true }
scylla = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }
uuid = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
vlatproto = { workspace = true }
