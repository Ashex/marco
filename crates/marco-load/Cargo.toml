[package]
name = "marco-load"
version = "0.1.0"
edition = "2021"
description = "marco's bulk loader (snapshot from exported (repo, rkey, subject) rows) and the P0 measurements: open, reads, verify, delete replay"
license = "MIT"
publish = false

[features]
default = ["jemalloc", "metrics"]
jemalloc = ["marco-ops/jemalloc"]
# off: marco-core without its op metrics, for the overhead bench
metrics = ["marco-core/metrics"]

[dependencies]
marco-core = { workspace = true }
marco-ops = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
zstd = { workspace = true }
clap = { workspace = true }
prometheus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
vlatproto = { workspace = true }
