[package]
name = "marco-core"
version.workspace = true
edition = "2021"
description = "marco's engine: the DID directory, relations, per-actor out logs, per-subject in sets and the snapshot file"
license = "MIT"
publish = false

[features]
default = ["metrics"]
# Prometheus histograms and counters per op (default registry); off compiles them out
metrics = ["dep:prometheus"]

[dependencies]
vlatproto = { workspace = true }
anyhow = { workspace = true }
memmap2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
xxhash-rust = { workspace = true }
rustc-hash = { workspace = true }
crossbeam-epoch = { workspace = true }
libc = { workspace = true }
prometheus = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "hit_path"
harness = false
