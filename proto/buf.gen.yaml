# Run from this directory via `just gen`, which puts the pinned local plugins
# on PATH. Rust (buffa messages + connect-rust services) into marco-proto.
version: v2
clean: true
plugins:
  - local: protoc-gen-buffa
    out: ../crates/marco-proto/src/gen/buffa
    opt: [views=true, json=true]
  - local: protoc-gen-connect-rust
    out: ../crates/marco-proto/src/gen/connect
    opt: [buffa_module=crate::proto]
  - local: protoc-gen-buffa-packaging
    out: ../crates/marco-proto/src/gen/connect
    strategy: all
    opt: [filter=services]
  # TypeScript (the console): protobuf-es v2 messages and service
  # descriptors, which is all connect-es v2 needs.
  - local: protoc-gen-es
    out: ../ui/src/gen
    opt: [target=ts]
