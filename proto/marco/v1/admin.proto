syntax = "proto3";

package marco.v1;

import "marco/v1/graph.proto";

// The operator API, on the admin listener (loopback by default) next to
// Graph, /metrics and /debug/*. Every call needs the admin token
// (`Authorization: Bearer <token>`) or a login from the trusted proxy
// header, except GetSession, which says which of the two a caller has.
service Admin {
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The snapshot, directory, relations, deltas, process and running job.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Rates and latencies sampled every 10 s, kept for 24 h.
  rpc GetSeries(GetSeriesRequest) returns (GetSeriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // The newest writes applied, after a seq.
  rpc ListRecentWrites(ListRecentWritesRequest) returns (ListRecentWritesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListShards(ListShardsRequest) returns (ListShardsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Bytes by section, and the lists whose deltas are biggest against their base.
  rpc GetStorage(GetStorageRequest) returns (GetStorageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListRelations(ListRelationsRequest) returns (ListRelationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // List lengths over the snapshot: computed in the background on the first
  // call, `ready` once done.
  rpc GetListStats(GetListStatsRequest) returns (GetListStatsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListSources(ListSourcesRequest) returns (ListSourcesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetActor(GetActorRequest) returns (GetActorResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // An actor's out or in list with each edge's rkey, time and where it's stored.
  rpc ListEdges(ListEdgesRequest) returns (ListEdgesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // A record by its at:// URI: its subject, where it's stored, the pair.
  rpc ResolveUri(ResolveUriRequest) returns (ResolveUriResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Folds the change segments into new shard files now: one cut of the whole
  // graph, the dirty shards rewritten, the manifest renamed. Starts a job and
  // answers at once; GetOverview and ListShards show its progress.
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse);
  // Checks every file's section checksums against the bytes on disk, as a job.
  rpc VerifyShards(VerifyShardsRequest) returns (VerifyShardsResponse);
  rpc SetTraceRatio(SetTraceRatioRequest) returns (SetTraceRatioResponse);
  // deleted drops the actor's records and hides it as a subject; takendown
  // hides both; active undoes either. Durable when it answers: it writes a
  // change segment at once.
  rpc SetActorStatus(SetActorStatusRequest) returns (SetActorStatusResponse);
}

message GetSessionRequest {}

message GetSessionResponse {
  // "token", "proxy", or empty when the caller has neither.
  string auth = 1;
  // The proxy's login.
  string operator = 2;
}

message GetOverviewRequest {}

message GetOverviewResponse {
  string version = 1;
  string commit = 2;
  int64 started_ms = 3;
  bool read_only = 4;
  SnapshotInfo snapshot = 5;
  DirectoryInfo directory = 6;
  repeated RelationTotals relations = 7;
  ProcessInfo process = 8;
  double trace_ratio = 9;
  Job job = 10;
  // A list's delta merges past this share of its base, and a shard is over
  // threshold past it.
  double merge_ratio = 11;
  uint32 dirty_shards = 12;
  uint32 over_shards = 13;
  // Delta entries (adds + deletes) not yet merged, every list.
  uint64 delta_entries = 14;
  // Records and pairs in the snapshot.
  uint64 base_entries = 15;
  uint64 tombstones = 16;
  // Bytes of lists merged since the snapshot.
  uint64 merged_bytes = 17;
  uint32 merged_lists = 18;
  // The last cursor a write carried.
  string write_cursor = 19;
  // Writes applied since start (the seq ListRecentWrites counts in).
  uint64 write_seq = 20;
  string api_listen = 21;
  string admin_listen = 22;
  Durability durability = 23;
  // Every expected source caught up since start; reads before it are flagged.
  bool ready = 24;
  // Why not ready, empty when ready.
  string ready_reason = 25;
  uint64 reads_before_ready = 26;
}

// Writes are applied in memory, then written every few seconds as a change
// segment (the ops and every source's cursor at that cut). A checkpoint
// folds the segments into new shard files when replaying them would take
// too long, or daily.
message Durability {
  double segment_interval_seconds = 1;
  // The newest segment written, its time, and how long its write took.
  uint64 segment = 2;
  int64 segment_ms = 3;
  double segment_write_seconds = 4;
  // Segments (and their bytes and ops) since the checkpoint: what a restart replays.
  uint32 segments = 5;
  uint64 segment_bytes = 6;
  uint64 segment_ops = 7;
  // Ops applied but not in a segment yet.
  uint64 pending_ops = 8;
  uint64 checkpoint = 9;
  int64 checkpoint_ms = 10;
  // A checkpoint starts once segment_ops passes this, or the checkpoint is this old.
  uint64 checkpoint_ops = 11;
  double checkpoint_age_seconds = 12;
  // The last checkpoint's wall time and bytes written.
  double checkpoint_seconds = 13;
  uint64 checkpoint_bytes = 14;
  uint32 checkpoint_shards = 15;
  // The replay at start: segments, ops and seconds.
  uint32 replayed_segments = 16;
  uint64 replayed_ops = 17;
  double replay_seconds = 18;
  // A segment write failing (it's retried until it lands), empty when none is.
  string segment_error = 19;
  // The last checkpoint's error, or one after its commit (cleanup, reopen);
  // cleared by the next that commits.
  string checkpoint_error = 20;
  uint64 checkpoint_failures = 21;
}

message SnapshotInfo {
  string path = 1;
  // The build id, hex.
  string build = 2;
  uint32 format = 3;
  uint32 shards = 4;
  uint64 size_bytes = 5;
  int64 written_ms = 6;
  // The open at start: mmap and footer checks.
  double open_seconds = 7;
  // Out lists this long get a by-subject index.
  uint32 subj_index = 8;
  uint32 files = 9;
}

message DirectoryInfo {
  // DIDs in the snapshot.
  uint64 base = 1;
  // DIDs added since.
  uint64 live = 2;
}

message RelationTotals {
  string name = 1;
  string collection = 2;
  string subject = 3;
  // Records now: the snapshot's, plus added less removed since start.
  uint64 records = 4;
  uint64 snapshot_records = 5;
  uint64 snapshot_pairs = 6;
  uint64 out_lists = 7;
  uint64 in_lists = 8;
  uint64 non_tid = 9;
  uint64 delta_out = 10;
  uint64 delta_in = 11;
  uint64 tombstones = 12;
  uint64 merged_bytes = 13;
}

message ProcessInfo {
  uint64 rss_bytes = 1;
  uint64 mem_total_bytes = 2;
  double cpu_seconds = 3;
  uint32 threads = 4;
  // Snapshot bytes in the page cache (mincore), sampled every 10 s.
  uint64 snapshot_cached_bytes = 5;
}

message Job {
  // "checkpoint" or "verify"; empty when none has run.
  string kind = 1;
  bool running = 2;
  int64 started_ms = 3;
  int64 finished_ms = 4;
  string error = 5;
  // Files done of files.
  uint32 done = 6;
  uint32 total = 7;
}

message GetSeriesRequest {
  // 180 (3 min), 3600 or 86400. At most 180 points come back.
  uint32 window_seconds = 1;
}

message GetSeriesResponse {
  int64 step_ms = 1;
  repeated int64 t_ms = 2;
  repeated Series series = 3;
}

// One sampled value over time. `metric` names it; the other fields are its
// labels, empty where they don't apply:
// op_rate, op_p50, op_p99 (op, rel; seconds), rpc_rate, rpc_p99, rpc_errors
// (rpc), applied (rel, outcome), merges (rel, dir), merge_p99 (dir),
// rss_bytes, cpu_cores, delta_entries, tombstones. Rates are per second.
message Series {
  string metric = 1;
  string op = 2;
  string rel = 3;
  string outcome = 4;
  string dir = 5;
  string rpc = 6;
  repeated double values = 7;
}

message ListRecentWritesRequest {
  uint64 after = 1;
  // Default 50, at most 256.
  uint32 limit = 2;
}

message ListRecentWritesResponse {
  // Newest first.
  repeated RecentWrite writes = 1;
  uint64 last_seq = 2;
}

message RecentWrite {
  uint64 seq = 1;
  int64 at_ms = 2;
  string rel = 3;
  bool add = 4;
  string actor = 5;
  // Empty for a delete that found nothing.
  string subject = 6;
  // added, exists, deleted, removed, not_found or error.
  string outcome = 7;
  string uri = 8;
}

message ListShardsRequest {}

message ListShardsResponse {
  repeated Shard shards = 1;
  double merge_ratio = 2;
  Job job = 3;
  // The directory file.
  uint64 directory_bytes = 4;
  string directory_verify = 5;
}

message Shard {
  uint32 shard = 1;
  // Its ids, lo inclusive, hi exclusive.
  uint32 lo = 2;
  uint32 hi = 3;
  uint64 size_bytes = 4;
  int64 written_ms = 5;
  // Records and pairs in the snapshot.
  uint64 base_entries = 6;
  uint64 delta_entries = 7;
  uint32 delta_lists = 8;
  uint32 merged_lists = 9;
  uint64 merged_bytes = 10;
  uint32 tombstones = 11;
  // clean, dirty or writing (a checkpoint is rewriting it).
  string state = 12;
  // unverified, verifying, ok or mismatch.
  string verify = 13;
  string verify_error = 14;
  // Its file and the checkpoint that wrote it; empty for a shard of new ids
  // with no file yet.
  string file = 15;
  uint64 checkpoint = 16;
}

message GetStorageRequest {
  // "ratio" (default) or "size".
  string by = 1;
}

message GetStorageResponse {
  repeated Section sections = 1;
  // Top 20 by `by`.
  repeated DeltaList deltas = 2;
  uint32 delta_lists = 3;
}

message Section {
  // As in the files: r0.out.small, dir.plc …
  string name = 1;
  // The relation's name, or "directory".
  string rel = 2;
  uint64 size_bytes = 3;
  uint32 files = 4;
}

message DeltaList {
  string did = 1;
  string rel = 2;
  Dir dir = 3;
  uint64 base = 4;
  uint64 adds = 5;
  uint64 dels = 6;
}

message ListRelationsRequest {}

message ListRelationsResponse {
  repeated RelationInfo relations = 1;
  // The relations as TOML.
  string config = 2;
}

message RelationInfo {
  string name = 1;
  string collection = 2;
  string subject = 3;
  uint64 records = 4;
  uint64 pairs = 5;
  // Records less pairs: an actor's repeat records naming one subject.
  uint64 duplicates = 6;
  uint64 non_tid = 7;
  // A list relation: the record's path to its list.
  string list = 8;
  // A companion: the list relation whose records it holds by owner.
  string owner_of = 9;
}

message GetListStatsRequest {
  string rel = 1;
}

message GetListStatsResponse {
  bool ready = 1;
  // 0 to 1 while computing.
  double progress = 2;
  int64 computed_ms = 3;
  ListDist out = 4;
  ListDist in = 5;
  // The longest lists, both directions.
  repeated BigList big = 6;
  // Out lists at least this long have a by-subject index.
  uint32 threshold = 7;
}

message ListDist {
  // counts[i]: lists with length in [2^i, 2^(i+1)).
  repeated uint64 log2_counts = 1;
  uint64 lists = 2;
  uint64 p50 = 3;
  uint64 p90 = 4;
  uint64 p99 = 5;
  uint64 p999 = 6;
  uint64 max = 7;
  uint64 over_threshold = 8;
}

message BigList {
  string did = 1;
  Dir dir = 2;
  uint64 length = 3;
}

message ListSourcesRequest {}

message ListSourcesResponse {
  repeated Source sources = 1;
}

message Source {
  string name = 1;
  // url, state, cursor_kind, lag, errors and reconnects are the source's own report.
  string url = 2;
  string state = 3;
  // The cursor of the last write applied.
  string cursor = 4;
  string cursor_kind = 5;
  double lag_seconds = 6;
  double ops_per_second = 7;
  uint64 errors = 8;
  uint64 reconnects = 9;
  // The cursor in the newest change segment: a restart resumes after it.
  string durable_cursor = 10;
  // Configured: readiness waits for it to catch up.
  bool expected = 11;
  bool caught_up = 12;
  int64 last_ms = 13;
  uint64 ops = 14;
}

message GetActorRequest {
  // A DID, or a list's AT URI.
  string actor = 1;
}

message GetActorResponse {
  string did = 1;
  // False when the directory doesn't have it.
  bool known = 2;
  uint32 id = 3;
  uint32 shard = 4;
  // active, deleted or takendown.
  string status = 5;
  repeated ActorRelation rels = 6;
  // A list node rather than a DID.
  bool list = 7;
}

message ActorRelation {
  string rel = 1;
  uint64 out = 2;
  uint64 in = 3;
  // Actors in both: out subjects that also name this actor.
  uint64 mutual = 4;
  // The oldest record's TID time, 0 when unknown (no records, or past 100k).
  int64 first_us = 5;
  // Where the lists are: base, delta or merged.
  string out_stored = 6;
  string in_stored = 7;
  // Distinct subjects of the out records: a list's members.
  uint64 out_subjects = 8;
}

message ListEdgesRequest {
  string actor = 1;
  string rel = 2;
  Dir dir = 3;
  // Default 50, at most 500.
  uint32 limit = 4;
  // Out: an rkey; in: a DID.
  string cursor = 5;
}

message ListEdgesResponse {
  repeated Edge edges = 1;
  string cursor = 2;
  uint64 total = 3;
}

message Edge {
  // The subject (out) or the actor (in).
  string did = 1;
  uint32 id = 2;
  // Out only.
  string rkey = 3;
  string uri = 4;
  int64 created_us = 5;
  // base, delta or merged.
  string stored = 6;
}

message ResolveUriRequest {
  string uri = 1;
}

message ResolveUriResponse {
  string rel = 1;
  string collection = 2;
  string actor = 3;
  uint32 actor_id = 4;
  // Empty when there's no such record.
  string subject = 5;
  uint32 subject_id = 6;
  string rkey = 7;
  bool tid = 8;
  int64 created_us = 9;
  string stored = 10;
  // 1 for the newest; 0 when unknown (past 100k records).
  uint64 position = 11;
  uint64 out_count = 12;
  uint32 shard = 13;
  // A delete for it came before its create.
  bool tombstoned = 14;
  // The actor's live records naming the subject.
  uint64 pair_records = 15;
  bool in_contains = 16;
  uint64 subject_in_count = 17;
  uint32 subject_shard = 18;
  string subject_in_stored = 19;
  // A list relation's record: its list, whose log holds the member edge.
  string list = 20;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  repeated Flag flags = 1;
  BuildInfo build = 2;
}

message Flag {
  string name = 1;
  string value = 2;
  // default, flag, env or unset.
  string source = 3;
}

message BuildInfo {
  string version = 1;
  string commit = 2;
  uint32 format = 3;
  repeated string features = 4;
}

message CheckpointRequest {}

message CheckpointResponse {
  Job job = 1;
}

message VerifyShardsRequest {}

message VerifyShardsResponse {
  Job job = 1;
}

message SetTraceRatioRequest {
  // 0 (off) to 1 (every op).
  double ratio = 1;
}

message SetTraceRatioResponse {
  double ratio = 1;
}

message SetActorStatusRequest {
  string did = 1;
  // active, deleted or takendown.
  string status = 2;
}

message SetActorStatusResponse {
  string did = 1;
  string status = 2;
  // Records the change removed (deleted).
  uint64 removed = 3;
}
