# marco: a graph database for atproto actor-to-actor edges. The engine
# (marco-core) and the bulk loader (marco-load). Builds on vlatproto by path.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
marco-core = { path = "crates/marco-core" }
vlatproto = { git = "https://github.com/jazware/vlatproto", rev = "8fd41163c003a39ae73c568d648434ef42f32049" }
anyhow = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.9"
rayon = "1"
zstd = "0.13"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 1

[profile.test]
opt-level = 1
debug = 0
codegen-units = 256

[profile.test.package."*"]
opt-level = 2
codegen-units = 16
